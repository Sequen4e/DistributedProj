[package]
name = "resource-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8.9"
bytesize = "2.3.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
crossterm = { version = "0.29", features = ["event-stream"] }
env_logger = "0.11.10"
hex = "0.4"
indicatif = "0.18.4"
log = "0.4.30"
ratatui = "0.30.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thousands = "0.2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.18"
tui-logger = "0.18.2"
