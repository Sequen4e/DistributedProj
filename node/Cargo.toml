[package]
name = "resource-node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
crossterm = { version = "0.27", features = ["event-stream"] }
ratatui = "0.27.0"
tui-logger = { version = "0.11.2", default-features = false, features = ["crossterm"] }
bytesize = "1.3"
thousands = "0.2"
tokio-stream = "0.1"
log = "0.4"